kind = "web"
previewPath = "/"
title = "Hockey Hearts Initiative"
version = "1.0.0"
id = "artifacts/hockey-hearts"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22382

[services.development]
run = "pnpm --filter @workspace/hockey-hearts run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hockey-hearts", "run", "build" ]
serve = "static"
publicDir = "artifacts/hockey-hearts/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22382"
BASE_PATH = "/"
